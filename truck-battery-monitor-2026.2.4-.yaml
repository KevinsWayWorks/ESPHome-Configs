esphome:
  name: car-battery-monitor
  friendly_name: car-battery-monitor
  includes:
    - custom_aes.h

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: "h490KTuym0+5KieK8e38T9UjoDIvpsFQ5eyxO5eTIPs="

ota:
- platform: esphome
  password: "ee6b4290c3f87c5b6a06fa0f4ec27887"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Car-Battery-Monitor"
    password: "rz0hkBzC6VaW"

captive_portal:

# FIX: Increased scan window. This tells the ESP32 to listen for 
# 250ms out of every 300ms, making it much more likely to catch 
# the battery monitors' signals.
esp32_ble_tracker:
  scan_parameters:
    interval: 300ms
    window: 200ms
    active: true

ble_client:
  - mac_address: B0:B1:13:29:AE:DB
    id: suburban_voltage
  - mac_address: 90:E2:02:34:EC:02
    id: challenger_voltage
  - mac_address: 94:A9:A8:48:1C:10
    id: popup_voltage

sensor:
  - platform: ble_client
    ble_client_id: suburban_voltage
    id: suburban_voltage_sensor
    name: "Suburban Voltage"
    service_uuid: 'fff0'
    type: characteristic
    characteristic_uuid: 'fff4'
    unit_of_measurement: 'V'
    accuracy_decimals: 2
    state_class: measurement
    device_class: voltage
    force_update: true
    notify: true
    lambda: |-
      mbedtls_aes_context aes;
      mbedtls_aes_init(&aes);
      unsigned char output[16];
      unsigned char key[16] = { 108, 101, 97, 103, 101, 110, 100, 255, 254, 49, 56, 56, 50, 52, 54, 54, };
      unsigned char iv[16] = {};
      mbedtls_aes_setkey_dec(&aes, key, 128);
      mbedtls_aes_crypt_cbc(&aes, MBEDTLS_AES_DECRYPT, 16, iv, (uint8_t*)&x[0], output);
      mbedtls_aes_free(&aes);
      return ((output[2] | (output[1] << 8)) >> 4) / 100.0f;  

  - platform: ble_client
    ble_client_id: challenger_voltage
    id: challenger_voltage_sensor
    name: "Challenger Voltage"
    service_uuid: 'fff0'
    type: characteristic
