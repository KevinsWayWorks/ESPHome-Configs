  - platform: ble_client
    ble_client_id: popup_voltage
    id: popup_voltage_sensor
    name: "Popup Voltage"
    service_uuid: 'fff0'
    type: characteristic
    characteristic_uuid: 'fff4'
    unit_of_measurement: 'V'
    accuracy_decimals: 2
